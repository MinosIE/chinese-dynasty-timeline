const tl=document.getElementById('timeline'),tabs=document.getElementById('tabs');
const ERAS=["全部","先秦","秦汉","三国两晋南北朝","隋唐","宋元","明清"];
let active="全部";
ERAS.forEach(e=>{const b=document.createElement('div');b.className='tab'+(e===active?' active':'');
  b.textContent=e;b.onclick=()=>{active=e;[...tabs.children].forEach(c=>c.classList.toggle('active',c.textContent===e));render();};
  tabs.appendChild(b);});

function roleTag(role,colorVar){return `<span class="dot" style="background:${colorVar}"></span>${role}`;}
function render(){
  tl.innerHTML='';
  DATA.filter(d=>active==="全部"||d.era===active).forEach((d,i)=>{
    const ec=ERA_COLORS[d.era]||"'#697386'";
    const emperors=d.emperors.map(e=>{const star=STAR.has(e.n);return `<div class="emp${star?' star':''}"><div class="emp-top"><span class="star-ic">★</span><span class="en">${e.n}</span>${e.t?`<span class="et">${e.t}</span>`:''}${star?'<span class="etag star-tag">名君</span>':''}</div><div class="emp-meta"><span class="er">在位 ${e.rg}（${e.ry}年）</span>${e.gh?`<span class="etag">年号 ${e.gh}</span>`:''}${e.mt?`<span class="etag">庙号 ${e.mt}</span>`:''}${e.sh?`<span class="etag">谥号 ${e.sh}</span>`:''}</div><span class="enote">${e.note}</span></div>`;}).join('');
    let talents='';
    for(const role in d.talents){
      const col=ROLE_COLORS[role]||"'#F59E0B'";
      const chips=d.talents[role].map(p=>`<span class="chip"><b>${p.n}</b><span class="note">${p.note}</span></span>`).join('');
      talents+=`<div class="tgroup"><div class="gt">${roleTag(role,col)}</div><div class="chips">${chips}</div></div>`;
    }
    const pills=d.policies.map(p=>`<span class="pill">${p}</span>`).join('');
    const node=document.createElement('div');node.className='node';node.style.animationDelay=(i*45)+'ms';
    node.innerHTML=`<article class="card collapsed">
      <span class="accent" style="background:${ec}"></span>
      <div class="chead" onclick="this.parentElement.classList.toggle('collapsed')">
        <span class="name">${d.name}</span><span class="years">${d.years}</span>
        <span class="meta">${d.capital} · 存${d.keepDur||((d.approx?'约':'')+d.emperors.reduce((s,e)=>s+(+e.ry||0),0)+'年')}</span>
        <span class="toggle"><span class="chev">▾</span>展开/收起</span>
      </div>
      <div class="panel"><div class="panel-i">
      <div class="feature">${d.feature}</div>
      <div class="body">
        <div class="sec"><div class="sec-h"><span class="ic" style="background:var(--brand)">👑</span><span class="t">帝王世系</span><span class="c">${d.emperors.length}位</span></div>
          <div class="emps">${emperors}</div></div>
        <div class="sec"><div class="sec-h"><span class="ic" style="background:var(--info)">⚔️</span><span class="t">核心人才</span></div>${talents}</div>
        <div class="sec"><div class="sec-h"><span class="ic" style="background:var(--warning)">📜</span><span class="t">政策与制度</span></div>
          <div class="pills">${pills}</div></div>
        <div class="summary">${d.summary}</div>
      </div>
      </div></div>
    </article>`;
    tl.appendChild(node);
  });
}
render();
</script>
<script type="module">
import { animate, inView } from "https://cdn.jsdelivr.net/npm/motion@11/+esm";
const reduceMM = matchMedia("(prefers-reduced-motion: reduce)").matches;
if (!reduceMM) {
  document.documentElement.classList.add("has-motion");
  document.querySelectorAll(".node").forEach((node, i) => {
    inView(node, () => {
      if (node.dataset.shown) return;
      node.dataset.shown = "1";
      animate(node, { opacity: [0, 1], y: [14, 0] },
        { duration: 0.55, type: "spring", bounce: 0.22, delay: Math.min(i, 6) * 0.05 });
    }, { amount: 0.15 });
  });
}
</script>
