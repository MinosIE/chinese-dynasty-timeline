<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>中华王朝 · 千年脉络 | 中国历史朝代科普</title>
<meta name="description" content="从夏到清的中国历史朝代科普：每个王朝的概览、帝王世系、核心人才与关键制度一目了然，帮你建立三千年王朝脉络。">

<meta name="twitter:card" content="summary_large_image">

<!-- 避免主题闪烁：首屏前即确定主题 -->
<script>
(function(){try{var t=localStorage.getItem('theme');if(!t){t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';}document.documentElement.setAttribute('data-theme',t);}catch(e){document.documentElement.setAttribute('data-theme','light');}})();
</script>
</head>
<body>
<div class="wrap">
  <section class="hero">
    <button class="theme-btn" id="themeBtn" title="切换明暗主题" aria-label="切换明暗主题">🌙 夜间</button>
    <h1>中华王朝 · 千年脉络</h1>
    <p>从夏到清，逐一展开每个朝代的帝王世系、核心人才与关键政策，帮你看懂三千年权力、制度与文明的流转。</p>
    <div class="kpis" id="kpis"></div>
  </section>

  <nav class="tabs" id="tabs"></nav>
  <main class="timeline" id="timeline"></main>

  <p class="foot">
    <span class="legend">👑 深红卡片</span> = 后世誉为「千古一帝」（秦始皇、汉武帝、唐太宗、康熙）　·　<span class="legend">★ 金色卡片</span> = 该朝代代表性名君　·　点击卡片可展开/收起详情（首次展开才加载该朝数据）<br>
    数据为科普概览，细节以权威史料为准　·　可考王朝史约4000年；上溯良渚、龙山等史前文明约5000年，故有「上下五千年」之说
  </p>
</div>

<noscript><p style="text-align:center;padding:20px">本页为交互式时间轴，建议开启 JavaScript 以获得完整体验。各朝代数据见 <code>data/overview.json</code> 与 <code>data/dynasties/</code>。</p></noscript>

<script>
const SITE="https://MinosIE.github.io/chinese-dynasty-timeline/";
const ERA_COLORS={"先秦":"#C79A3A","秦汉":"#D4351C","三国两晋南北朝":"#7C3AED","隋唐":"#0EA5E9","宋元":"#059669","明清":"#EA580C"};
const ROLE_COLORS={"文臣":"#3B82F6","武将":"#EF4444","思想·文人":"#10B981","其他":"#F59E0B"};
const ASPECT_ORDER=["政治","经济","文化"];
const ASPECT_COLORS={"政治":"#D4351C","经济":"#059669","文化":"#7C3AED"};
const STAR=new Set(["禹(大禹)","汤(天乙)","武丁","周武王(姬发)","秦始皇(嬴政)","汉高祖(刘邦)","汉武帝(刘彻)","王莽(新)","汉光武帝(刘秀)","蜀汉昭烈帝(刘备)","吴大帝(孙权)","晋武帝(司马炎)","北魏孝文帝(拓跋宏)","梁武帝(萧衍)","隋文帝(杨坚)","隋炀帝(杨广)","唐太宗(李世民)","武则天","唐玄宗(李隆基)","宋太祖(赵匡胤)","宋徽宗(赵佶)","元世祖(忽必烈)","明太祖(朱元璋)","明成祖(朱棣)","清圣祖(玄烨)","清世宗(胤禛)","清高宗(弘历)"]);
const LEGEND=new Set(["秦始皇(嬴政)","汉武帝(刘彻)","唐太宗(李世民)","清圣祖(玄烨)"]);
const LEGEND_DYNASTIES=new Set(["qin","han","tang","qing"]);
const HONOR_REASON={
"秦始皇(嬴政)":"灭六国、首称皇帝，废分封行郡县，书同文车同轨——明代李贽誉其为「千古一帝」。",
"汉武帝(刘彻)":"北击匈奴、凿通西域丝路、独尊儒术，奠定汉家制度与疆域，后世常与秦始皇并称。",
"唐太宗(李世民)":"缔造贞观之治，纳谏用贤、开疆拓土、万国来朝，被后世誉为「千古一帝」。",
"清圣祖(玄烨)":"平三藩、收台湾、拒沙俄、定漠北，开创康乾盛世，史称「千古一帝」。",
"禹(大禹)":"治水定九州，建立夏朝，开启世袭之制。",
"汤(天乙)":"灭夏建商，任用伊尹，开国明君。",
"武丁":"武丁中兴，商朝国力鼎盛。",
"周武王(姬发)":"伐纣灭商，分封诸侯，奠定周制。",
"汉高祖(刘邦)":"布衣起兵，开两汉四百年基业。",
"王莽(新)":"代汉建新、托古改制，评价两极。",
"汉光武帝(刘秀)":"光武中兴，重建汉室。",
"蜀汉昭烈帝(刘备)":"兴复汉室，以仁德著称。",
"吴大帝(孙权)":"据江东立国，与魏蜀鼎足而立。",
"晋武帝(司马炎)":"灭吴统一，结束三国分裂。",
"北魏孝文帝(拓跋宏)":"迁都洛阳、易服改姓，推动民族大融合。",
"梁武帝(萧衍)":"在位近半个世纪，崇佛好文。",
"隋文帝(杨坚)":"结束南北分裂，开创开皇之治。",
"隋炀帝(杨广)":"开大运河、创科举，功过并存。",
"武则天":"中国历史上唯一的女皇帝，承前启后。",
"唐玄宗(李隆基)":"缔造开元盛世，盛唐之巅。",
"宋太祖(赵匡胤)":"陈桥兵变建国，杯酒释兵权。",
"宋徽宗(赵佶)":"书画大家，然治国失当终致亡国。",
"元世祖(忽必烈)":"定国号元，灭宋统一，疆域空前。",
"明太祖(朱元璋)":"驱元建明，布衣天子。",
"明成祖(朱棣)":"开创永乐盛世，迁都北京、郑和下西洋。",
"清世宗(胤禛)":"勤于政事、锐意革新，承前启后。",
"清高宗(弘历)":"十全武功，康乾盛世之极。"
};
const ERAS=["全部","先秦","秦汉","三国两晋南北朝","隋唐","宋元","明清"];

const tl=document.getElementById('timeline');
const tabsEl=document.getElementById('tabs');
const kpisEl=document.getElementById('kpis');
const cache={};           // id -> detail object
let overview=[];
let active="全部";

/* ---------- 主题 ---------- */
const themeBtn=document.getElementById('themeBtn');
function syncThemeIcon(){themeBtn.textContent=document.documentElement.getAttribute('data-theme')==='dark'?'☀️ 日间':'🌙 夜间';}
syncThemeIcon();
themeBtn.onclick=()=>{const next=document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark';
  document.documentElement.setAttribute('data-theme',next);localStorage.setItem('theme',next);syncThemeIcon();};

/* ---------- Tabs ---------- */
ERAS.forEach(e=>{const b=document.createElement('div');b.className='tab'+(e===active?' active':'');
  b.textContent=e;b.onclick=()=>{active=e;[...tabsEl.children].forEach(c=>c.classList.toggle('active',c.textContent===e));render();};
  tabsEl.appendChild(b);});

/* ---------- KPI ---------- */
function renderKpis(){
  const dynasties=overview.length;
  const people=overview.reduce((s,o)=>s+o.counts.emperors+o.counts.talents,0);
  kpisEl.innerHTML=`
    <div class="kpi"><div class="badge">👑</div><div style="display:flex;flex-direction:column"><span class="v">${dynasties}</span><span class="l">主要王朝</span></div></div>
    <div class="kpi"><div class="badge">📜</div><div style="display:flex;flex-direction:column"><span class="v">约4000</span><span class="l">年王朝（夏→清）</span></div></div>
    <div class="kpi"><div class="badge">⚔️</div><div style="display:flex;flex-direction:column"><span class="v">${people}+</span><span class="l">帝王与人才</span></div></div>`;
}

/* ---------- 渲染概览时间轴 ---------- */
function render(){
  tl.innerHTML='';
  const list=overview.filter(o=>active==="全部"||o.era===active);
  const io=new IntersectionObserver((entries)=>{entries.forEach(en=>{if(en.isIntersecting){en.target.classList.add('in');io.unobserve(en.target);}});},{amount:0.15});
  list.forEach((o,i)=>{
    const ec=ERA_COLORS[o.era]||"#697386";
    const node=document.createElement('div');node.className='node reveal';node.id=o.id;
    node.innerHTML=`<span class="dot" style="border-color:${ec}"></span>
      <article class="card collapsed">
        <span class="accent" style="background:${ec}"></span>
        <div class="chead">
          <span class="name">${o.name}</span><span class="years">${o.years}</span>${LEGEND_DYNASTIES.has(o.id)?'<span class="legend-mark">👑 千古一帝</span>':''}
          <span class="meta">${o.capital} · 存续${o.duration}</span>
          <span class="toggle"><span class="chev">▾</span>展开详情</span>
        </div>
        <div class="feature">${o.feature}</div>
        <div class="stats">
          <span class="stat">帝王 <b>${o.counts.emperors}</b> 位</span>
          <span class="stat">人才 <b>${o.counts.talents}</b> 位</span>
          <span class="stat">制度 <b>${o.counts.policies}</b> 项</span>
        </div>
        <div class="panel"><div class="panel-i"><div class="detail" data-id="${o.id}"></div></div></div>
      </article>`;
    const card=node.querySelector('.card');
    node.querySelector('.chead').onclick=()=>{
      const collapsed=card.classList.toggle('collapsed');
      const t=node.querySelector('.toggle');
      t.innerHTML=`<span class="chev">▾</span>${collapsed?'展开详情':'收起详情'}`;
      if(!collapsed) loadDetail(o.id, node.querySelector('.detail'));
    };
    tl.appendChild(node);
    if(matchMedia('(prefers-reduced-motion: reduce)').matches){node.classList.add('in');}else{io.observe(node);}
  });
}

/* ---------- 懒加载详情 ---------- */
async function loadDetail(id, container){
  if(container.dataset.loaded) return;
  if(cache[id]){container.innerHTML=buildDetail(cache[id]);container.dataset.loaded="1";return;}
  container.dataset.loaded="1";
  container.innerHTML=`<div class="loading"><span class="spinner"></span>正在加载 ${id} 详情…</div>`;
  try{
    const res=await fetch(`data/dynasties/${id}.json`);
    if(!res.ok) throw new Error(res.status);
    const d=await res.json();
    cache[id]=d;
    container.innerHTML=buildDetail(d);
  }catch(e){
    container.innerHTML=`<div class="loading">详情加载失败，请检查网络或 data/dynasties/${id}.json 是否存在。</div>`;
  }
}

function buildDetail(d){
  const emperors=d.emperors.map(e=>{const legend=LEGEND.has(e.n);const star=!legend&&STAR.has(e.n);return `<div class="emp${legend?' legend':(star?' star':'')}"><div class="emp-top"><span class="star-ic">${legend?'👑':(star?'★':'')}</span><span class="en">${e.n}</span>${e.t?`<span class="et">${e.t}</span>`:''}${legend?`<span class="etag legend-tag hontag" data-tip="${HONOR_REASON[e.n]||''}"><span class="hint-ic">ⓘ</span>千古一帝</span>`:(star?`<span class="etag star-tag hontag" data-tip="${HONOR_REASON[e.n]||''}"><span class="hint-ic">ⓘ</span>名君</span>`:'')}</div><div class="emp-meta"><span class="er">在位 ${e.rg}（${e.ry}年）</span>${e.gh?`<span class="etag">年号 ${e.gh}</span>`:''}${e.mt?`<span class="etag">庙号 ${e.mt}</span>`:''}${e.sh?`<span class="etag">谥号 ${e.sh}</span>`:''}</div><span class="enote">${e.note}</span></div>`;}).join('');
  let talents='';
  for(const role in d.talents){
    const col=ROLE_COLORS[role]||"#F59E0B";
    const chips=d.talents[role].map(p=>`<span class="chip"><b>${p.n}</b><span class="note">${p.note}</span></span>`).join('');
    talents+=`<div class="tgroup"><div class="gt"><span class="dot" style="background:${col}"></span>${role}</div><div class="chips">${chips}</div></div>`;
  }
  const pills=d.policies.map(p=>`<span class="pill">${p}</span>`).join('');
  let aspects='';
  if(d.aspects){
    aspects=ASPECT_ORDER.filter(k=>d.aspects[k]).map(k=>{
      const items=d.aspects[k].map(x=>`<li>${x}</li>`).join('');
      return `<div class="aspect"><div class="aspect-h"><span class="dot" style="background:${ASPECT_COLORS[k]}"></span>${k}</div><ul class="aspect-list">${items}</ul></div>`;
    }).join('');
  }
  return `<div class="body">
      <div class="sec"><div class="sec-h"><span class="ic" style="background:var(--brand)">👑</span><span class="t">帝王世系</span><span class="c">${d.emperors.length}位</span></div>
        <div class="emps">${emperors}</div></div>
      <div class="sec"><div class="sec-h"><span class="ic" style="background:var(--info,#0EA5E9)">⚔️</span><span class="t">核心人才</span></div>${talents}</div>
      <div class="sec"><div class="sec-h"><span class="ic" style="background:var(--gold)">📜</span><span class="t">政策与制度</span></div>
        <div class="pills">${pills}</div></div>
      ${aspects?`<div class="sec"><div class="sec-h"><span class="ic" style="background:#0EA5E9">🏛️</span><span class="t">政治 · 经济 · 文化</span></div><div class="aspects">${aspects}</div></div>`:''}
      <div class="summary">${d.summary}</div>
    </div>`;
}

/* ---------- GEO: 注入 JSON-LD (ItemList) ---------- */
function injectJsonLd(){
  const data={
    "@context":"https://schema.org",
    "@type":"ItemList",
    "name":"中华王朝时间轴",
    "description":"科普中国历史朝代（夏到清）的静态网页，含各王朝概览、帝王世系、核心人才与关键制度。",
    "url":SITE,
    "itemListElement":overview.map((o,i)=>({
      "@type":"ListItem","position":i+1,
      "item":{"@type":"Thing","name":o.name,"description":o.feature+" "+o.summary,
        "url":SITE+"#"+o.id,"additionalProperty":[{"@type":"PropertyValue","name":"时期","value":o.era},{"@type":"PropertyValue","name":"年代","value":o.years},{"@type":"PropertyValue","name":"都城","value":o.capital}]}
    }))
  };
  const s=document.createElement('script');s.type='application/ld+json';s.textContent=JSON.stringify(data);
  document.head.appendChild(s);
}

/* ---------- 称号 hover 说明 ---------- */
const tip=document.createElement('div');tip.className='hon-tip';document.body.appendChild(tip);
function showTip(el){const t=el.dataset.tip;if(!t)return;tip.textContent=t;tip.classList.add('show');
  const r=el.getBoundingClientRect(),tr=tip.getBoundingClientRect();
  const left=Math.max(8,Math.min(r.left+r.width/2-tr.width/2,innerWidth-tr.width-8));
  let top=r.top-tr.height-10;if(top<8)top=r.bottom+10;
  tip.style.left=left+'px';tip.style.top=top+'px';}
document.addEventListener('mouseover',e=>{const el=e.target.closest('.hontag');if(el)showTip(el);});
document.addEventListener('mouseout',e=>{if(e.target.closest('.hontag'))tip.classList.remove('show');});

/* ---------- 启动 ---------- */
(async function init(){
  try{
    const res=await fetch('data/overview.json');
    if(!res.ok) throw new Error(res.status);
    overview=await res.json();
  }catch(e){
    tl.innerHTML=`<div class="loading">概览数据加载失败：请确认 data/overview.json 存在且通过 HTTP 访问（GitHub Pages 部署后正常）。</div>`;
    return;
  }
  renderKpis();
  render();
  injectJsonLd();
})();
</script>
</body>
</html>
